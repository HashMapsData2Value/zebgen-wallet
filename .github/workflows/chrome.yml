name: Chrome Runtime

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - run: npm run test:chrome
