name: Firefox Runtime

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Report runner environment
        run: |
          uname -a
          cat /etc/os-release
          node --version
          npm --version
          df -h
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - uses: browser-actions/setup-firefox@v1
        id: firefox
      - run: npm run test:firefox
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
